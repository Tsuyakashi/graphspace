<!doctype html><meta charset=utf-8><body style="margin:0"><textarea id=t style="width:100%;height:300px"></textarea><pre id=log></pre><script>
// Заглушка Craft для тестов хоста: протокол как у craft-web-host. Содержимое — текст после 'MOCK:' в байтах.
const app='deckcraft'; let name=null, dirty=false, opens=0;
const post=(m,tr)=>parent.postMessage(m, location.origin, tr||[]);
const setDirty=(d)=>{ if(d!==dirty){dirty=d; post({type:app+':dirty',dirty:d});} };
addEventListener('message',e=>{ const d=e.data||{}; if(e.source!==parent) return;
  if(d.type===app+':open'){ opens++; name=d.name; const txt=new TextDecoder().decode(d.bytes); const i=txt.indexOf('MOCK:'); t.value=i>=0?txt.slice(i+5):''; setDirty(false); log.textContent='opened '+name+' #'+opens; }
  if(d.type===app+':saved'){ log.textContent+=' saved-ack'; }
});
t.oninput=()=>setDirty(true);
window[app]={execute(cmd){ if(cmd==='file.save'){ const b=new TextEncoder().encode('MOCK:'+t.value).buffer; const saveAs=!name; post({type:app+':save',name:name||'Presentation1.deckcraft',saveAs,bytes:b},[b]); if(saveAs) name='Presentation1.deckcraft'; setDirty(false);} }};
addEventListener('keydown',e=>{ if(e.ctrlKey&&e.code==='KeyS'){e.preventDefault(); window[app].execute('file.save');} });
post({type:app+':ready',version:'1',appVersion:'mock',file:false});
</script>
