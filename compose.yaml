# Локальный запуск образа: docker compose up -d --build. Прод — образ из GHCR, compose в graphspace-infrastructure.
# Craft внутри образа (craft-versions.json), том ./craft не нужен.
# Наружу Graphspace публикуется только через Cloudflare Tunnel + Access; cloudflared, DNS и политики настраиваются отдельно.
# Порт только на loopback ВМ: к нему ходит cloudflared, запущенный на этой же ВМ. Наружу никаких портов на 0.0.0.0.
services:
  graphspace:
    build: .
    image: graphspace:local
    restart: unless-stopped
    # Владелец ./data на хосте. Обычный Docker: uid пользователя ВМ (обычно 1000). Rootless Docker: 0:0.
    user: "${GRAPHSPACE_UID:-1000}:${GRAPHSPACE_GID:-1000}"
    environment:
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?https://<team>.cloudflareaccess.com}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:?Application Audience (AUD) Tag приложения в Access}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:4680:4680"
