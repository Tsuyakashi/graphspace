# Локальная разработка: Postgres и S3 (SILO, форк MinIO), сервер — `npm start` с .env.
#   cp .env.example .env && docker compose up -d && npm start
# Образ целиком (как на проде, но вход dev): docker compose --profile app up -d --build.
# Прод — образ из GHCR, его compose и секреты — в graphspace-infrastructure.
# Порты только на loopback.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphspace
      POSTGRES_PASSWORD: graphspace
      POSTGRES_DB: graphspace
    volumes:
      - pg:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "graphspace", "-d", "graphspace"]
      interval: 2s
      retries: 30

  s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: graphspace
      MINIO_ROOT_PASSWORD: graphspace-dev-secret
    volumes:
      - s3:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  graphspace:
    profiles: [app]
    build: .
    image: graphspace:local
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_started }
    environment:
      AUTH_MODE: dev
      DATABASE_URL: postgres://graphspace:graphspace@postgres:5432/graphspace
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: graphspace
      S3_SECRET_KEY: graphspace-dev-secret
    ports:
      - "127.0.0.1:4680:4680"

volumes:
  pg:
  s3:
